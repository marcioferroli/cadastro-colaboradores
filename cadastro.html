<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Colaboradores</title>
</head>

<body>

    <div class="container">
    <h1>Cadastro de Novo Colaborador</h1>

    <form action="processo_Cadastro.php" method="POST">

        <label for="nome1">Nome completo:</label><br>
        <input type="text" id="nome1" name="nome1" required>
        <br><br>

        <label for="idade2">Idade:</label><br>
        <input type="number" id="idade2" name="idade2" required>
        <br><br>

        <label for="profissao3">Profissão:</label><br>
        <input type="text" id="profissao3" name="profissao3" required>
        <br><br>

        <label for="salario4">Salário pretendido:</label><br>
        <input type="number" id="salario4" name="salario4" step="0.01" required>
        <br><br>

        <label for="experiencia5">Experiência anterior:</label><br>
        <textarea id="experiencia5" name="experiencia5" rows="6" cols="40" required></textarea>
        <br><br>

        <button type="submit">Cadastrar</button>

    </form>
    </div>
</body>
</html>
